[package]
name = "rimskifikator"
version = "0.1.19"
description = "Local expressive ebook narration and reading"
authors = ["Dogma contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "rimskifikator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.4", features = [] }

[dependencies]
tauri = { version = "~2.8", features = ["tray-icon"] }
tauri-plugin-dialog = "~2.4"
tauri-plugin-single-instance = "~2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
