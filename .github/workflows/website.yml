name: Website

# Publish only validated website assets from this repository.
# Training, labeling, model and application files are never site inputs.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/github_pages.py'
      - 'scripts/build_website_metadata.py'
      - 'verification/test_github_pages.py'
      - 'verification/check_website_languages.mjs'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'scripts/github_pages.py'
      - 'scripts/build_website_metadata.py'
      - 'verification/test_github_pages.py'
      - 'verification/check_website_languages.mjs'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check publication boundaries
        run: python3 -m unittest verification.test_github_pages
      - name: Check audiobook language selection
        run: node --test verification/check_website_languages.mjs
      - name: Validate static site and immutable audio hashes
        run: python3 scripts/github_pages.py check --site website
      - name: Upload website assets
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: website

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
