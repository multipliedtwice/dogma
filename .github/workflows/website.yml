name: Public website checks

# GitHub Pages is served from a separate dogma-demo repository containing only
# validated site files. Training and labeling data are never site inputs.
on:
  push:
    paths:
      - 'website/**'
      - 'scripts/github_pages.py'
      - 'scripts/build_website_metadata.py'
      - 'verification/test_github_pages.py'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'scripts/github_pages.py'
      - 'scripts/build_website_metadata.py'
      - 'verification/test_github_pages.py'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check publication boundaries
        run: python3 -m unittest verification.test_github_pages
      - name: Validate static site and immutable audio hashes
        run: python3 scripts/github_pages.py check --site website
